[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sec-disclosure-comparison"
version = "0.1.0"
description = "SEC filing extraction, disclosure comparison, annotation, and evaluation pipeline."
requires-python = ">=3.10"
dependencies = [
    "lxml>=5.0,<7",
    "openai>=2.0,<3",
    "python-dotenv>=1.0,<2",
    "google-cloud-secret-manager>=2.20,<3",
    "google-crc32c>=1.5,<2",
    "langgraph>=1.2.12,<2",
    "langgraph-checkpoint-sqlite>=3.1.1,<4",
    "psycopg[binary]>=3.1,<4",
    "scikit-learn>=1.4,<2",
    "psutil>=6,<8",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1,<4"]
ui = ["streamlit>=1.52,<2", "pandas>=2.0", "tzdata>=2024.1"]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "app"]
testpaths = ["tests"]
