<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1530" viewBox="0 0 1280 1530" role="img" aria-labelledby="title desc">
<title id="title">Disclosure alignment with LangGraph</title>
<desc id="desc">Saved disclosures are compared within the same SEC Item. Exact text bypasses the LLM. LangGraph coordinates matching, local tools, verification and bounded correction loops. SQLite checkpoints and the API ledger support resume. Results are exported to two final JSON files: alignments and needs_review.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#475569"/></marker></defs>
<style>
text {font-family:Arial,Helvetica,sans-serif;fill:#172554}
.title {font-size:30px;font-weight:700}
.sub {font-size:17px;fill:#475569}
.heading {font-size:19px;font-weight:700;text-anchor:middle}
.detail {font-size:15px;fill:#334155;text-anchor:middle}
.label {font-size:14px;fill:#475569}
.edge {fill:none;stroke:#475569;stroke-width:2;marker-end:url(#arrow)}
</style>
