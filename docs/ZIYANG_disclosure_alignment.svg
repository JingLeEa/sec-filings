<text x="200.0" y="421" class="detail">Retain extraction warnings</text>
<path d="M430 390 H350" class="edge"/>
<text x="375" y="377" class="label">Yes</text>
<path d="M200 455 V480 H27 V1322 H430" class="edge"/>
<text x="45" y="1270" class="label">Exact links + original citations</text>
<rect x="430" y="480" width="480" height="80" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<text x="670.0" y="509" class="heading">Retrieve candidates locally</text>
<text x="670.0" y="533" class="detail">Same Item, both directions; no API tokens</text>
